<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Season3 AR Plus</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: transparent !important;
  font-family: Arial, sans-serif;
}

.a-enter-vr,
.a-enter-vr-button {
  display: none !important;
}

/* 검정 화면 덮임 방지 */
.mindar-ui-overlay,
.mindar-ui-scanning,
.mindar-ui-loading {
  background: transparent !important;
}

#guide {
  position: fixed;
  top: 18px;
  left: 47%;
  transform: translateX(-50%);
  z-index: 999999;
  background: rgba(0,0,0,0.72);
  color: white;
  padding: 12px 22px;
  border-radius: 24px;
  font-size: 18px;
  text-align: center;
  line-height: 1.45;

  min-width: 250px;
}
#retry {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 1000000; padding: 14px 22px; border: 0; border-radius: 14px;
  background: #1769aa; color: white; font-size: 17px; font-weight: bold;
}
#retry[hidden] { display: none; }
</style>
</head>

<body>

<div id="guide">
  자유의 여신상 이미지를<br>
  카메라에 비춰 주세요
</div>

<button id="retry" hidden type="button">카메라 다시 실행</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="panelImg" src="./panel.png">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-image
      src="#panelImg"
      position="0 0 0"
      width="7.5"
      height="6.0">
    </a-image>
  </a-entity>

</a-scene>

<script>
const guide = document.getElementById("guide");
const target = document.getElementById("target");
const scene = document.querySelector("a-scene");
const retry = document.getElementById("retry");
let state = "waiting";
let timer;
let started = false;
const instruction = "자유의 여신상 이미지를<br>카메라에 비춰 주세요";

// MindAR의 카메라 요청에만 적용되는 페이지 내부 호환성 처리.
const ownedStreams = new Set();
let lastCameraError = null;
const media = navigator.mediaDevices;
const nativeGet = media && media.getUserMedia && media.getUserMedia.bind(media);
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
function stopStream(stream) {
  stream.getTracks().forEach(track => track.stop());
  ownedStreams.delete(stream);
}
async function acquire(constraints) {
  const stream = await nativeGet(constraints);
  if (state === "closed" || state === "failed") {
    stopStream(stream);
    throw new DOMException("Session ended", "AbortError");
  }
  ownedStreams.add(stream);
  return stream;
}
function isRear(track) {
  const direction = track.getSettings().facingMode;
  return direction ? direction === "environment" : /back|rear|environment|후면/i.test(track.label);
}
async function compatibleCamera(constraints) {
  const video = constraints && constraints.video;
  if (!video) return acquire(constraints);
  const errors = [];
  async function attempt(c) {
    const stream = await acquire(c);
    if (isRear(stream.getVideoTracks()[0])) return stream;
    stopStream(stream);
    throw new DOMException("Rear camera not confirmed", "NotFoundError");
  }
  try { return await attempt(constraints); }
  catch (err) {
    errors.push(err);
    if (["NotAllowedError", "SecurityError", "AbortError"].includes(err.name)) { lastCameraError = err; throw err; }
  }
  guide.textContent = "다른 후면 카메라를 찾고 있습니다.";
  let devices = await media.enumerateDevices();
  // 권한 승인 전에는 장치 이름이 숨겨질 수 있다. 기본 카메라를 잠시 열어 목록을 확보한다.
  if (!devices.some(d => d.kind === "videoinput" && d.label)) {
    try {
      const probe = await acquire({video:true, audio:false});
      try {
        if (isRear(probe.getVideoTracks()[0])) return probe;
        devices = await media.enumerateDevices();
      } finally {
        if (!isRear(probe.getVideoTracks()[0])) stopStream(probe);
      }
    } catch (err) { errors.push(err); if (["NotAllowedError", "SecurityError", "AbortError"].includes(err.name)) { lastCameraError = err; throw err; } }
  }
  const candidates = devices.filter(d => d.kind === "videoinput" && d.deviceId && !/front|user|전면/i.test(d.label));
  candidates.sort((a,b) => Number(/back|rear|environment|후면/i.test(b.label))-Number(/back|rear|environment|후면/i.test(a.label)));
  for (const d of candidates) {
    for (const extra of [{}, {width:{ideal:640},height:{ideal:480},frameRate:{ideal:15}}]) {
      if (state !== "starting" && state !== "ready") throw new DOMException("Session ended", "AbortError");
      await delay(700);
      try { return await attempt({audio:false,video:{deviceId:{exact:d.deviceId},...extra}}); }
      catch (err) { errors.push(err); console.warn("Camera candidate failed", d.label, err.name); if (["NotAllowedError", "SecurityError", "AbortError"].includes(err.name)) { lastCameraError = err; throw err; } }
    }
  }
  lastCameraError = errors[errors.length-1] || new DOMException("No rear camera", "NotFoundError");
  throw lastCameraError;
}
// MindAR 1.2.5는 내부에서 getUserMedia를 호출하므로 별도 스트림을 미리 열지 않는다.
if (nativeGet) media.getUserMedia = async function(constraints) {
  try { return await compatibleCamera(constraints); }
  catch (err) { lastCameraError = err; throw err; }
};

function releaseCamera() {
  for (const stream of [...ownedStreams]) stopStream(stream);
  const system = scene.systems && scene.systems["mindar-image-system"];
  // Capture video references before MindAR removes its video element.
  const videos = new Set(document.querySelectorAll("video"));
  if (system && system.video) videos.add(system.video);
  if (system && started) {
    try { system.stop(); } catch (err) { console.warn("MindAR stop", err); }
  }
  for (const video of videos) {
    const stream = video.srcObject;
    if (stream && typeof stream.getTracks === "function") {
      stream.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }
  }
}

function fail(message, error) {
  if (state === "failed" || state === "closed") return;
  state = "failed";
  clearTimeout(timer);
  console.error("AR initialization", error || message);
  releaseCamera();
  guide.textContent = message;
  retry.hidden = false;
}

function startAR() {
  if (state !== "waiting") return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    fail("HTTPS 접속 및 카메라 지원 브라우저를 확인해 주세요.");
    return;
  }
  const system = scene.systems && scene.systems["mindar-image-system"];
  if (!system || typeof system.start !== "function") {
    fail("AR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
    return;
  }
  state = "starting";
  started = true;
  guide.textContent = "카메라를 준비하고 있습니다. 권한 요청이 나타나면 허용해 주세요.";
  try {
    Promise.resolve(system.start()).catch(err => {
      fail("카메라 또는 AR 초기화 실패: " + (err.name || err.message || "알 수 없는 오류"), err);
    });
  } catch (err) {
    fail("AR 실행 실패: " + (err.name || "오류"), err);
  }
}

scene.addEventListener("arReady", () => {
  if (state !== "starting") { releaseCamera(); return; }
  clearTimeout(timer);
  state = "ready";
  guide.innerHTML = instruction;
});
scene.addEventListener("arError", event => {
  const detail = event.detail || {};
  fail("카메라 또는 AR 실행 실패: " + (lastCameraError?.name || detail.error || "초기화 오류") + ". 다시 실행해 주세요.", lastCameraError || detail);
});
target.addEventListener("targetFound", () => {
  if (state === "ready") guide.innerHTML = "자유의 여신상 AR정보가<br>표시되었습니다";
});
target.addEventListener("targetLost", () => {
  if (state === "ready") guide.innerHTML = instruction;
});

// Reload rather than starting a second MindAR session in the same document.
retry.addEventListener("click", () => {
  releaseCamera();
  location.reload();
});
window.addEventListener("pagehide", () => {
  state = "closed";
  clearTimeout(timer);
  releaseCamera();
});
window.addEventListener("pageshow", event => {
  if (event.persisted) location.reload();
});

guide.textContent = "AR 체험을 준비하고 있습니다.";
timer = setTimeout(() => {
  fail("AR 준비 시간이 초과되었습니다. 카메라 권한과 인터넷 연결을 확인한 후 다시 실행해 주세요.");
}, 60000);
if (scene.hasLoaded) startAR();
else scene.addEventListener("loaded", startAR, { once: true });
</script>

</body>
</html>
